<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="tgbup-token" content="{{.Token}}">
<title>Chats · tgbup</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/common.js" defer></script>
<script src="/static/chats.js" defer></script>
</head>
<body>
<header class="top">
  <b class="logo">tgbup</b>
  <nav><a href="/">Overview</a><a href="/chats" class="on">Chats</a><a href="/archive/html/">Archive</a></nav>
</header>
<main>
  <p class="muted">Tick the chats to archive. In a forum, open its topics to leave some out; new topics are archived automatically. Nothing changes until you save.</p>
  <div class="toolbar">
    <select id="group" aria-label="Group"></select>
    <input id="search" type="search" placeholder="Search by title or @username" autocomplete="off">
    <span id="selected" class="muted"></span>
    <button id="review" type="button">Review and save…</button>
  </div>
  <div class="bulk"><button type="button" id="all" class="link">select all in this list</button> · <button type="button" id="none" class="link">clear all in this list</button></div>
  <div id="loading" class="muted">Loading your chats from Telegram…</div>
  <table class="chatlist" hidden>
    <thead><tr><th></th><th>Chat</th><th>Type</th><th class="num">Messages</th><th>Topics</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <button type="button" id="more" hidden>Show more</button>
  <dialog id="confirm">
    <h2>Save this chat list?</h2>
    <pre id="report" class="log"></pre>
    <details><summary>Config file that will be written</summary><pre id="config" class="log"></pre></details>
    <div class="actions"><button type="button" id="cancel" class="secondary">Back</button><button type="button" id="save">Save</button></div>
  </dialog>
  <div id="toast" class="toast" hidden></div>
</main>
</body>
</html>
