<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telegram archive</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<h1>Telegram archive</h1>
<input id="q" type="search" placeholder="Search all chats…" autofocus>
<div id="results"></div>
<table class="chats">
<tr><th>Chat</th><th>Type</th><th class="num">Messages</th><th class="num">Last</th></tr>
{{- range .Chats}}
<tr><td><a href="{{.Href}}.html">{{.Title}}</a></td><td>{{.Type}}</td><td class="num">{{.Messages}}</td><td class="num">{{.Last}}</td></tr>
{{- end}}
</table>
<script src="assets/search.js"></script>
<script>tgbupSearch.init({{.SearchFiles}})</script>
</body>
</html>
