<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<nav class="crumbs"><a href="../index.html">Archive</a> › {{.Title}}</nav>
<h1>{{.Title}}</h1>
<table class="chats">
<tr><th>{{if .Forum}}Topic{{else}}Part{{end}}</th><th class="num">Messages</th><th>Dates</th><th></th></tr>
{{- range .Threads}}
<tr><td><a href="{{.Latest}}.html">{{or .Title "Messages"}}</a></td><td class="num">{{.Messages}}</td><td>{{.Range}}</td><td><a href="{{.Dates}}">calendar</a></td></tr>
{{- end}}
</table>
</body>
</html>
